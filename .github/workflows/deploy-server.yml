name: Deploy server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Railway deploy hook
        id: check
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: set RAILWAY_DEPLOY_HOOK_URL (and optional SERVER_HEALTH_URL) in Phase 19."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Railway deploy
        if: steps.check.outputs.skip == 'false'
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --show-error --silent --request POST "$RAILWAY_DEPLOY_HOOK_URL"

      - name: Health check
        if: steps.check.outputs.skip == 'false'
        env:
          SERVER_HEALTH_URL: ${{ secrets.SERVER_HEALTH_URL }}
        run: |
          if [ -z "$SERVER_HEALTH_URL" ]; then
            echo "SERVER_HEALTH_URL not set; skipping health check."
            exit 0
          fi
          echo "Waiting for deploy to settle..."
          sleep 30
          for i in 1 2 3 4 5 6; do
            if curl --fail --show-error --silent "$SERVER_HEALTH_URL"; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i failed; retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after retries."
          exit 1
