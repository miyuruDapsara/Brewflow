# Local development stack: client + server + MongoDB
# Usage: docker compose up --build

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - brewflow_mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/brewflow
      CLIENT_ORIGIN: http://localhost:5173
      PAYHERE_RETURN_URL: http://localhost:5173/checkout/return
      PAYHERE_CANCEL_URL: http://localhost:5173/checkout/cancel
    depends_on:
      mongo:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ''
        VITE_UI_DEMO: 'true'
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server

volumes:
  brewflow_mongo_data:
