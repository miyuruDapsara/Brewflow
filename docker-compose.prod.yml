# Production-like stack: client + server, MongoDB Atlas (no local mongo)
# Usage: docker compose -f docker-compose.prod.yml up --build
# Requires MONGODB_URI (Atlas) and JWT_SECRET in .env

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
      PAYHERE_RETURN_URL: http://localhost:5173/checkout/return
      PAYHERE_CANCEL_URL: http://localhost:5173/checkout/cancel

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        VITE_API_URL: ''
        VITE_UI_DEMO: 'true'
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - server
